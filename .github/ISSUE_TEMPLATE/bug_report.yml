name: Bug report
description: Something looks or works wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://deu.salivra.com/haberler
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Scroll to …
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari 18, iPhone 15
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
